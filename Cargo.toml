[package]
name = "wmde-notifications"
version = "0.1.0"
authors = ["Ashley Wulber <ashley@system76.com>"]
edition = "2024"
rust-version = "1.93"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "autosize",
    "dbus-config",
    "a11y",
    "winit",
    "multi-window",
    "wayland",
    "tokio",
    "dbus-config",
] }
anyhow = "1.0"
color-backtrace = "0.7.2"
cosmic-notifications-util = { path = "./cosmic-notifications-util" }
cosmic-notifications-config = { path = "./cosmic-notifications-config" }
cosmic-panel-config = { git = "https://github.com/pop-os/cosmic-panel" }
rustix = "1.1.4"
tokio = { version = "1.52.1", features = [
    "sync",
    "rt",
    "tracing",
    "macros",
    "net",
    "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["std", "env-filter"] }
tracing-journald = { version = "0.3.2", optional = true }
zbus = { version = "5.14.0", features = ["tokio", "p2p"] }
enumflags2 = "0.7.12"

[features]
systemd = ["dep:tracing-journald"]
default = ["systemd"]

[workspace]
members = ["cosmic-notifications-util", "cosmic-notifications-config"]

[profile.release]
opt-level = "s"
lto = "thin"

# Redirect the upstream libcosmic (and every crate it vendors: cosmic-config,
# cosmic-theme, and all the iced_* crates) plus cosmic-panel-config to the local
# WMDE forks. Crate names are kept upstream on purpose, so the patch keys match.
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }

[patch."https://github.com/pop-os/cosmic-panel"]
cosmic-panel-config = { path = "../wmde-panel/cosmic-panel-config" }
